{% extends "base.html" %}
{% block title %}Restore progress{% endblock %}
{% block body %}
<h1>Restore your progress</h1>
<p class="lede">Progress is tied to a six-character player code shown on your progress page.
Enter it here to continue on this device.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" class="row">
  <input type="text" name="resume" maxlength="6" placeholder="ABC123" autocomplete="off"
         style="max-width:9rem; text-transform:uppercase; letter-spacing:.18em; font-family:var(--mono)">
  <button class="btn p" type="submit">Restore</button>
</form>
{% endblock %}
