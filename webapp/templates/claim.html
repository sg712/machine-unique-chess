{% extends "base.html" %}
{% block title %}Restore progress{% endblock %}
{% block body %}
<h1>Restore your progress</h1>
<p class="lede">For progress saved with the old six character code system. Email-linked progress requires
<a href="{{ url_for('login') }}">your email and password</a>.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" class="row">
  <label for="resume">Old progress code</label>
  <input type="text" id="resume" name="resume" maxlength="6" placeholder="ABC123" autocomplete="off"
         style="max-width:9rem; text-transform:uppercase; letter-spacing:.18em; font-family:var(--mono)">
  <button class="btn p" type="submit">Restore</button>
</form>
{% endblock %}
