{% extends "base.html" %}
{% block title %}Sign in — Machine Unique Chess{% endblock %}
{% block body %}
<div class="narrow">
<h1 class="tight">Sign in</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <p style="margin-top:1.2rem"><button class="btn p" type="submit">Sign in</button></p>
</form>
<p class="small">New here? <a href="{{ url_for('register') }}">Create an account</a>.
&middot; Progress from the old code system? <a href="{{ url_for('claim') }}">Restore a code</a>.</p>
</div>
{% endblock %}
