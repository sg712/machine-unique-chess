<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Machine Unique Chess{% endblock %}</title>
<meta property="og:title" content="Machine Unique Chess">
<meta property="og:description" content="Play the moves engines see and humans miss. Study 8 mined patterns, then take the blind spot test.">
<meta property="og:image" content="https://www.machine-unique-chess.com/static/og.png">
<meta property="og:url" content="https://www.machine-unique-chess.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="sheet">
  <div class="masthead">
    <a class="brand" href="{{ url_for('index') }}">Machine Unique Chess</a>
    {% set ep = request.endpoint %}
    <nav aria-label="Main navigation">
      <a href="{{ url_for('learn') }}"{% if ep in ('learn', 'concept', 'drill') %} class="on"{% endif %}>Learn</a>
      <a href="{{ url_for('blindspot_test') }}"{% if ep == 'blindspot_test' %} class="on"{% endif %}>Test</a>
      {% if code %}<a href="{{ url_for('profile') }}"{% if ep == 'profile' %} class="on"{% endif %}>Progress</a>{% endif %}
      <a href="{{ url_for('research') }}"{% if ep == 'research' %} class="on"{% endif %}>Research</a>
      {% if email %}<a href="{{ url_for('logout') }}">Sign out</a>
      {% elif code %}<a href="{{ url_for('register') }}">Register</a>
      {% else %}<a href="{{ url_for('login') }}">Sign in</a>{% endif %}
    </nav>
    <button type="button" class="sound-toggle" id="sound-toggle" aria-pressed="true">Sound on</button>
  </div>
  <main id="main" tabindex="-1">{% block body %}{% endblock %}</main>
  <noscript><p class="note">The interactive chessboards need JavaScript. You can still read the research and browse the patterns.</p></noscript>
</div>
<script type="module" src="{{ url_for('static', filename='board.js') }}"></script>
</body>
</html>
