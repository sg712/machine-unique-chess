<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Machine Unique Chess{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <a class="brand" href="{{ url_for('index') }}">Machine Unique Chess</a>
    <span>
      <a href="{{ url_for('learn') }}">Learn</a>
      <a href="{{ url_for('blindspot_test') }}">Test</a>
      {% if code %}<a href="{{ url_for('profile') }}">Progress</a>{% endif %}
      <a href="{{ url_for('research') }}">Research</a>
      {% if email %}<a href="{{ url_for('logout') }}">Sign out</a>
      {% elif code %}<a href="{{ url_for('register') }}">Register</a>
      {% else %}<a href="{{ url_for('login') }}">Sign in</a>{% endif %}
    </span>
  </div>
  {% block body %}{% endblock %}
</div>
</body>
</html>
