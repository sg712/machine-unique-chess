<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Unnamed Concepts{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="sheet">
  <div class="masthead">
    <a class="brand" href="{{ url_for('index') }}">Unnamed Concepts</a>
    <span>
      <a href="{{ url_for('research') }}">The research</a>
      {% if code %}<a href="{{ url_for('profile') }}">Your progress</a>
      {% else %}<a href="{{ url_for('claim') }}">Have a code?</a>{% endif %}
    </span>
  </div>
  {% block body %}{% endblock %}
</div>
</body>
</html>
