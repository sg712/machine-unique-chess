{% extends "base.html" %}
{% block title %}Register — Machine Unique Chess{% endblock %}
{% block body %}
<div class="narrow">
<h1 class="tight">Create an account</h1>
<p class="lede">Any progress you've already made in this browser comes with you.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email">
  <label for="password">Password <span style="text-transform:none;letter-spacing:0">(8+ characters)</span></label>
  <input type="password" id="password" name="password" required minlength="8"
         autocomplete="new-password">
  <p style="margin-top:1.2rem"><button class="btn p" type="submit">Register</button></p>
</form>
<p class="small">Already have an account? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</div>
{% endblock %}
